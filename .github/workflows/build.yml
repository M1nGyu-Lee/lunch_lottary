name: Build desktop apps

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win
            format: portable
            arch: x64
            artifact: dist/*.exe
          - os: macos-15-intel
            target: mac
            format: dmg
            arch: x64
            artifact: dist/LunchLottery-macOS-x64-*.dmg
          - os: macos-latest
            target: mac
            format: dmg
            arch: arm64
            artifact: dist/LunchLottery-macOS-arm64-*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      # electron-builder 26 writes NFD helper names. mac.extendInfo.CFBundleName
      # uses the same form to preserve the Korean product name (upstream #9962).
      - run: pnpm exec electron-builder --${{ matrix.target }} ${{ matrix.format }} --${{ matrix.arch }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verify and test the Mac disk image
        if: matrix.target == 'mac'
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/lunch-smoke" --ignore-scripts --no-audit --no-fund playwright@1.62.1
          VERSION=$(node -p "require('./package.json').version")
          DMG="dist/LunchLottery-macOS-${{ matrix.arch }}-$VERSION.dmg"
          hdiutil verify "$DMG"
          mkdir -p "$RUNNER_TEMP/lunch-dmg"
          hdiutil attach -nobrowse -readonly -mountpoint "$RUNNER_TEMP/lunch-dmg" "$DMG"
          trap 'hdiutil detach "$RUNNER_TEMP/lunch-dmg"' EXIT
          codesign --verify --deep --strict "$RUNNER_TEMP/lunch-dmg/점심복권.app"
          ditto "$RUNNER_TEMP/lunch-dmg/점심복권.app" "$RUNNER_TEMP/lunch-installed/점심복권.app"
          hdiutil detach "$RUNNER_TEMP/lunch-dmg"
          trap - EXIT
          codesign --verify --deep --strict "$RUNNER_TEMP/lunch-installed/점심복권.app"
          python3 - <<'PY'
          import os, plistlib
          from pathlib import Path
          contents = Path(os.environ['RUNNER_TEMP']) / 'lunch-installed/점심복권.app/Contents'
          with (contents / 'Info.plist').open('rb') as file:
              name = plistlib.load(file)['CFBundleName']
          helpers = os.listdir(contents / 'Frameworks')
          for suffix in ['', ' (Renderer)', ' (GPU)', ' (Plugin)']:
              assert name + ' Helper' + suffix + '.app' in helpers, (name, helpers)
          print('Mac bundle and helper names match byte for byte')
          PY
          NODE_PATH="$RUNNER_TEMP/lunch-smoke/node_modules" \
          SMOKE_EXECUTABLE="$RUNNER_TEMP/lunch-installed/점심복권.app/Contents/MacOS/점심복권" \
          node scripts/desktop-smoke.cjs
      - name: Mac crash diagnostics
        if: failure() && matrix.target == 'mac'
        shell: bash
        run: |
          find "$HOME/Library/Logs/DiagnosticReports" -name '*.ips' -mmin -10 -exec cat {} \; || true
      - uses: actions/upload-artifact@v4
        with:
          name: lunch-lottery-${{ matrix.target }}-${{ matrix.arch }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  release:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: lunch-lottery-*
          path: release
          merge-multiple: true
      - name: Package source and checksums
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "RELEASE_TAG=v$VERSION" >> "$GITHUB_ENV"
          git archive --format=zip --prefix=lunch-lottery/ --output="release/LunchLottery-source-$VERSION.zip" HEAD
          cd release
          sha256sum *.exe *.dmg *.zip > SHA256SUMS.txt
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; build artifacts remain available in Actions."
          else
            gh release create "$RELEASE_TAG" release/* --target "$GITHUB_SHA" --title "점심복권 $RELEASE_TAG" --generate-notes
          fi
